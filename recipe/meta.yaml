{% set name = "pymc-extras" %}
{% set version = "0.12.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 2288a17cd2b32a42de00ab4511e4d211cf1808ed3afa1ee745f5aecd422d47af

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<312]

requirements:
  host:
    - python
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python
    - pymc >=6.0,<7.0
    - arviz >=1.1.0
    - better-optimize >=0.4.2,<1.0
    - pydantic >=2.0.0
    - preliz >=0.25.0
  run_constrained:
    # complete, dask_histogram optional extras
    - dask <2025.1.1
    - dask-core <2025.1.1

test:
  source_files:
    - tests
  imports:
    - pymc_extras
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert version('{{ name }}')=='{{ version }}'"
    # Tests passed locally, but tests need more than 30 minutes each Python iteration. Skipped.
    #- pytest -v tests
  requires:
    - pip
    - pytest >=6.0
    - pytest-mock
    - statsmodels

about:
  home: https://github.com/pymc-devs/pymc-extras
  summary: A home for new additions to PyMC, which may include unusual probability distribitions, advanced model fitting algorithms, or any code that may be inappropriate to include in the pymc repository, but may want to be made available to users.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: |
    As PyMC continues to mature and expand its functionality to accommodate
    more domains of application, we increasingly see cutting-edge methodologies,
    highly specialized statistical distributions,and complex models appear.
  doc_url: https://www.pymc.io/projects/extras
  dev_url: https://github.com/pymc-devs/pymc-extras

extra:
  recipe-maintainers:
    - maresb
    - fonnesbeck
